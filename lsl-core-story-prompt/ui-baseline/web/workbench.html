<title>剧情核心工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 布局：和导演界面 UI-7 同一套——单栏卷轴，页首放这一集的核心和四个阶段，吸顶页签＋跳转，正文是按段排的卡片和按秒的表 */
:root{
  --bg:#eef1ee; --surface:#fbfcfa; --sunk:#e3e8e3; --ink:#1b211e; --muted:#58645d; --line:#cdd5cf;
  --gold:#8a5f0e; --gold-soft:#f1e3c4; --jade:#2f6450; --jade-soft:#d9e9e0;
  --warn-bg:#fbe7d6; --warn-ink:#8a3b0c; --shadow:rgba(27,33,30,.18);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#181d1a; --sunk:#202723; --ink:#e4eae6; --muted:#9aa79f; --line:#2d3631;
  --gold:#d9b25c; --gold-soft:#3a2f17; --jade:#8cc3a8; --jade-soft:#1d3329; --warn-bg:#3d2616; --warn-ink:#f2b88d; --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#181d1a; --sunk:#202723; --ink:#e4eae6; --muted:#9aa79f; --line:#2d3631;
  --gold:#d9b25c; --gold-soft:#3a2f17; --jade:#8cc3a8; --jade-soft:#1d3329; --warn-bg:#3d2616; --warn-ink:#f2b88d; --shadow:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-right,0px)) 64px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[disabled]{opacity:.5;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1 1 auto}
.muted{color:var(--muted)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{margin:0;font-size:13px;color:var(--muted);max-width:72ch}
.code{font-family:var(--f-mono);font-size:12px;color:var(--gold);margin-right:6px;white-space:nowrap}

/* 按钮：和导演界面一样，主按钮实心墨绿，次按钮描边 */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;font-size:13.5px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08);color:var(--surface)}
.btn.out{background:none;border-color:var(--jade);color:var(--jade)}
.btn.out:hover{background:var(--surface)}
.btn.sm{min-height:30px;font-size:13px;padding:3px 10px}
.lnk{font-size:13px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.lnk:hover{border-color:var(--gold);color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;max-width:100%}
.tag.ok{color:var(--jade);border-color:var(--jade);background:var(--jade-soft)}
.tag.wait{color:var(--gold);border-color:var(--gold)}
.tag.warn{color:var(--warn-ink);border-color:var(--warn-ink);background:var(--warn-bg)}
.tag.dash{border-style:dashed}
.tag b{font-weight:700}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--jade-soft);border-top-color:var(--jade);animation:sp 1s linear infinite;vertical-align:-1px;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.done{background:var(--jade)}
.dot.wait{background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.dot.run{background:none;border:2px solid var(--jade);width:10px;height:10px}
.dot.stale{background:none;border:1.5px dashed var(--gold);width:10px;height:10px}

/* 页首 */
.mast{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
h1{font-size:clamp(28px,5.6vw,44px);font-weight:800;letter-spacing:.04em}
.core{display:flex;flex-direction:column;gap:10px;padding:18px 20px 16px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:4px 4px 10px 10px}
.core .lab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.coretext{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(20px,3.1vw,27px);line-height:1.65;max-width:34em}
.coretext.empty{color:var(--muted);font-size:18px}
.lede{max-width:70ch;color:var(--muted);margin:0}
.lede b{color:var(--ink)}
.arc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.arc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.arc{gap:8px}.stage{padding:10px 12px}.stage .l{display:none}.stage .n{font-size:15.5px}}
.stage{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer;min-width:0}
.stage:hover{border-color:var(--gold)}
.stage.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.stage .n .tag{margin-left:auto;font-family:var(--f-body);font-weight:500}
.stage .n{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;font-size:17px}
.stage .n i{font-style:normal;font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted)}
.stage .d{font-family:var(--f-mono);font-size:12px;color:var(--gold);overflow-wrap:anywhere}
.stage.done .d{color:var(--jade)}
.stage .nodes{display:flex;flex-direction:column;gap:1px;font-size:13px}
.stage .nodes span{display:flex;align-items:center;gap:8px}
.stage .nodes .todo{color:var(--muted)}
.stage .l{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
details.vlog{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.vlog>summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--muted)}
details.vlog ul{list-style:none;margin:0;padding:0 12px 10px;display:flex;flex-direction:column}
details.vlog li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
details.vlog li b{font-family:var(--f-mono);font-weight:500;color:var(--gold);min-width:2.6em}
details.vlog li .lb{flex:1 1 220px;min-width:0}
details.vlog li .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* 吸顶栏：页签 + 跳转 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.views{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex:none;max-width:100%;overflow-x:auto}
.views button{position:relative;font-size:13.5px;font-weight:500;padding:5px 12px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.views button+button{border-left:1px solid var(--line)}
.views button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.views .bd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:2px}
.runbar{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--jade);background:var(--jade-soft);border-radius:999px;padding:2px 4px 2px 12px;max-width:100%}
.runbar #liveN{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between}
.quick{display:flex;gap:6px;flex:none;align-items:center;flex-wrap:wrap}
select.proj{font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:240px;min-height:30px}
.jump{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%;order:3;padding-block:2px}
@media (max-width:720px){.jump{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.jump::-webkit-scrollbar{display:none}}
.jump a{flex:none;font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--surface);display:inline-flex;align-items:center;gap:6px}
.jump a.mono{font-family:var(--f-mono)}
.jump a:hover{border-color:var(--gold);color:var(--gold)}
.jump a[aria-current="true"]{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.jump a .mk{font-family:var(--f-body);font-size:11px}
.jump a.ok .mk{color:var(--jade)} .jump a.wait .mk{color:var(--gold)} .jump a.stale .mk{color:var(--warn-ink)}
.jump a[aria-current="true"] .mk{color:var(--surface)}

/* 左侧细刻度目录（同导演界面） */
.rail{position:fixed;left:calc(env(safe-area-inset-left,0px) + 4px);top:55%;transform:translateY(-50%);z-index:6;width:18px;max-height:70vh;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:6px 2px;border:1px solid transparent;border-radius:8px}
.rail a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:12.5px;white-space:nowrap;min-height:9px;line-height:1.2}
.rail i{flex:none;display:block;width:9px;height:2px;border-radius:1px;background:var(--line)}
.rail a[aria-current="true"] i{background:var(--gold);height:3px;width:13px}
.rail a[aria-current="true"]{color:var(--gold)}
.rail span{display:none}
.rail:hover,.rail:focus-within{width:230px;overflow-y:auto;background:var(--surface);border-color:var(--line);box-shadow:0 10px 28px -8px var(--shadow);padding:8px}
.rail:hover a,.rail:focus-within a{min-height:24px}
.rail:hover span,.rail:focus-within span{display:block;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.rail{display:none}}

/* 正文 */
.view{display:flex;flex-direction:column;gap:34px;min-width:0}
.ephead{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--ink);padding-top:14px}
.ephead h2{font-size:24px;font-weight:800}
.ephead .meta{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.ephead p{margin:0;color:var(--muted);max-width:72ch;font-size:14px}
.ephead .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:calc(var(--barh,96px) + 12px)}
.sh{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.sh h3{font-size:19px;font-weight:800}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.empty p{margin:0;color:var(--muted);max-width:68ch}
.decide{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:8px 12px;font-size:13.5px}
.decide b{display:block;margin-bottom:2px}
.okbox{background:var(--jade-soft);color:var(--jade);border-radius:6px;padding:8px 12px;font-size:13.5px}
.next{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.next .t{font-size:14px;min-width:0;flex:1 1 300px}
.next .t small{display:block;color:var(--muted);font-size:12.5px}

/* 核心候选 */
.cands{display:flex;flex-direction:column;gap:10px}
.cand{display:grid;grid-template-columns:2.1em minmax(0,1fr);gap:2px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.cand.chosen{background:var(--jade-soft);border-color:var(--jade)}
.letter{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;color:var(--ink)}
.cand .letter{color:var(--muted);font-size:22px}
.cand.chosen .letter{color:var(--jade)}
.cbody{display:flex;flex-direction:column;gap:7px;min-width:0}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--muted)}
.ctext{margin:0;font-family:var(--f-display);font-weight:600;font-size:17.5px;line-height:1.75;color:var(--ink)}
.ctext.big{font-size:19px}
.ctext mark{background:var(--gold-soft);color:inherit;border-bottom:2px solid var(--gold);padding:0 1px}
.tests{display:flex;flex-wrap:wrap;gap:6px}
.step,.effect{margin:0;font-size:13px;color:var(--muted)}
.step b{color:var(--ink);font-weight:500}
.cact{display:flex;flex-wrap:wrap;gap:8px}
.anno{display:flex;align-items:flex-start;gap:8px;background:var(--gold-soft);border-radius:6px;padding:7px 10px;font-size:13px}
.anno .q{color:var(--gold);font-weight:700}
.anno .x{margin-left:auto;flex:none;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.anno .x:hover{color:var(--warn-ink)}
.form{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.form label,.composer label{font-size:12.5px;color:var(--muted)}
input.f,textarea.f{width:100%;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);line-height:1.6}
textarea.f{resize:vertical}
.composer{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.composer .crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* 段卡片（同导演界面的分段卡片） */
.seg{display:flex;flex-direction:column;scroll-margin-top:calc(var(--barh,96px) + 8px)}
.shead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,96px));z-index:4;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:10px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 12px -12px var(--shadow)}
@media (max-width:720px){.shead{position:static}}
.srow1{display:flex;align-items:center;gap:6px 10px;min-width:0;flex-wrap:wrap}
.stitle{flex:1 1 auto;min-width:0;font-size:16px;font-weight:600}
.srow1 .t{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.srow2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:0 0 10px 10px;display:flex;flex-direction:column;min-width:0}
.band{background:var(--gold-soft);padding:9px 14px;font-size:13.5px;display:flex;gap:10px;align-items:baseline}
.band .k{flex:none;font-weight:700;color:var(--gold);letter-spacing:.06em}
.cardb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.picked{display:flex;flex-direction:column;gap:6px}
.picked .lab{font-size:12.5px;font-weight:700;color:var(--jade);letter-spacing:.06em}

/* 时间线和曲线 */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px}
.curve{position:relative;height:104px;margin-top:20px}
.curve svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pk{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-mono);font-size:11.5px;color:var(--gold);white-space:nowrap;padding-bottom:2px}
.sbar{display:flex;gap:3px;margin-top:8px}
.sbar button{min-width:0;text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:flex;flex-direction:column;cursor:pointer;overflow:hidden}
.sbar button:hover{border-color:var(--gold)}
.sbar .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.sbar .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .st{font-size:11.5px;white-space:nowrap;color:var(--muted)}
.sbar .ok .st{color:var(--jade)} .sbar .wait .st{color:var(--gold)} .sbar .stale .st{color:var(--warn-ink)}
.sbar button.wait{border-color:var(--gold)}
.axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
@media (max-width:720px){.sbar{flex-wrap:wrap}.sbar button{flex:1 1 30%!important}}

/* 表 */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--muted);white-space:nowrap;font-size:12.5px}
td.tm{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
td.cc{font-weight:500}
.wide table{min-width:760px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.two h4{font-size:15px;margin-bottom:6px}
.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.plain li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
ol.read{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
ol.read li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:4px 12px;padding:9px 14px;border-top:1px solid var(--line)}
ol.read li:first-child{border-top:0}
ol.read .c{font-family:var(--f-mono);font-size:12.5px;color:var(--gold);padding-top:3px}
ol.read .s{font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.7}
ol.read .s.none{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13.5px}
ol.rules{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;max-width:76ch}
.lanes{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 14px}
.lane{display:grid;grid-template-columns:9em minmax(0,1fr);gap:6px 14px;padding:10px 0;border-top:1px solid var(--line)}
.lane:first-child{border-top:0}
.lane .ln b{display:block;font-family:var(--f-display);font-weight:800;font-size:15.5px}
.lane .ln span{font-size:12.5px;color:var(--muted)}
.track{position:relative;height:18px;border-bottom:2px solid var(--sunk);margin-top:6px}
.track i{position:absolute;bottom:-6px;width:10px;height:10px;border-radius:50%;background:var(--jade);transform:translateX(-50%);border:2px solid var(--surface)}
.lane .ev{grid-column:2;font-size:13px;color:var(--muted)}
.lane .ev .tm{font-family:var(--f-mono);font-size:12px;color:var(--ink)}

<div class="wrap">

<script>
(function(){
"use strict";
// 用户要浅色：默认锁浅色（系统是深色也不翻过去）
try{document.documentElement.setAttribute("data-theme","light")}catch(e){}

// ---------- 方法论（每次调用 Claude 都带上） ----------
var METHOD = [
"你是“剧情核心”调度助手，帮导演在剧本和分镜之间先定下“核心”。规则：",
"1. 剧本里已经写定的事件、台词、字幕、时长不能改；你额外加的东西都要能删。",
"2. 核心句必须能拍：写出一个人、一件看得见的东西、一个反复做的动作、最后的变化；不许用“爱、坚守、思念、家国、情怀、命运、灵魂”这类拍不出来的词。",
"3. 段核心必须是集核心里的一步；各段按顺序连读，应当正好是集核心一步步往前走。",
"4. 情绪不写形容词，写手上在做的事和画面里看得见的结果。",
"5. 用户的标注和要求是硬条件，必须照做，意思不能丢。",
"6. 剧本里引用歌词的字幕只写“（剧本字幕）”，不要复述歌词原文。",
"7. 只输出要求的 JSON，用简体中文。"
].join("\n");
var BANNED = /(爱情|坚守|思念|家国|情怀|命运|灵魂|深情|感动)/;

// 流程（LangGraph 思路）：12 个节点，状态在节点间传递；人工节点停下来等人
var NODES = [
 {id:"n01",label:"读剧本",kind:"ai"},
 {id:"n02",label:"划分已定和空着",kind:"ai"},
 {id:"n03",label:"集核心候选",kind:"ai"},
 {id:"n04",label:"你选集核心",kind:"human"},
 {id:"n05",label:"段核心候选",kind:"ai"},
 {id:"n06",label:"你选段核心",kind:"human"},
 {id:"n07",label:"能拍测试",kind:"ai"},
 {id:"n08",label:"四张表",kind:"ai"},
 {id:"n09",label:"自动检查",kind:"local"},
 {id:"n10",label:"你取舍提案",kind:"human"},
 {id:"n11",label:"剧情核心提示词",kind:"local"},
 {id:"n12",label:"交给导演 skill",kind:"human"}
];
var STAGES = [
 {key:"ep",name:"集核心",nodes:["n01","n02","n03","n04"],note:"剧本写定的不改，空着的才要设计"},
 {key:"seg",name:"段核心",nodes:["n05","n06"],note:"集核心一改，各段标“待重算”"},
 {key:"tables",name:"四张表",nodes:["n07","n08","n09","n10"],note:"检查出漏洞，就带着漏洞退回去重写"},
 {key:"prompt",name:"剧情核心提示词",nodes:["n11","n12"],note:"合成一份，交给导演 skill"}
];
var VIEWS = [["ep","集核心"],["seg","段核心"],["tables","四张表"],["prompt","剧情核心提示词"]];
var NODE_GO = {n01:["ep","sec-script"],n02:["ep","sec-split"],n03:["ep","sec-ep"],n04:["ep","sec-ep"],n05:["seg",null],n06:["seg",null],n07:["tables","sec-test"],n08:["tables","sec-props"],n09:["tables","sec-check"],n10:["tables","sec-prop"],n11:["prompt","sec-prompt"],n12:["prompt","sec-hand"]};
var BTN = {n01:"让 Claude 读剧本",n02:"让 Claude 划分已定和空着",n03:"让 Claude 写集核心候选",n04:"去选集核心",n05:"让 Claude 写段核心候选",n06:"去选段核心",n07:"让 Claude 做能拍测试",n08:"让 Claude 写四张表",n09:"运行自动检查",n10:"去取舍提案",n11:"去看剧情核心提示词",n12:"去交给导演 skill"};

// ---------- 状态 ----------
var db=null, sample=null, downloads=null;
var projects=[], pid=null, S=null, checkpoints=[];
var ui={view:null, open:{}, anno:null, lastSel:null, drafts:{}, newProj:false, connecting:true, scrollTo:null, vlogOpen:false};
var running=null, liveText="";
var unsubProject=null, unsubChecks=null, writing=Promise.resolve();

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on")},3400)}
function dis(){return running?" disabled":""}
function segs(){return (S&&S.script&&S.script.segments)||[]}
function segBy(code){return segs().filter(function(s){return s.code===code})[0]}
function dur(s){return (s.b-s.a)}
function timeStr(s){return "（"+s.a+"–"+s.b+"）"+dur(s)+" 秒"}
function totalDur(){var sg=segs();return S.duration||(sg.length?sg[sg.length-1].b:0)||0}
function nodeLabel(id){return (NODES.filter(function(n){return n.id===id})[0]||{}).label||""}
function epChosen(){var e=S&&S.ep;if(!e||!e.chosen)return null;return (e.candidates||[]).filter(function(c){return c.id===e.chosen})[0]||null}
function segState(code){S.seg=S.seg||{};S.seg[code]=S.seg[code]||{candidates:[],chosen:null,annotations:[]};return S.seg[code]}
function segChosen(code){var g=S.seg&&S.seg[code];if(!g||!g.chosen)return null;return (g.candidates||[]).filter(function(c){return c.id===g.chosen})[0]||null}
function epText(){var c=epChosen();return c?c.text:""}
function segsHash(){return segs().map(function(s){var c=segChosen(s.code);return s.code+":"+(c?c.text:"")}).join("|")}
function segStale(code){var g=S.seg&&S.seg[code];return !!(g&&g.candidates&&g.candidates.length&&g.basedOn&&g.basedOn!==epText())}
function chosenCount(){return segs().filter(function(s){return segChosen(s.code)&&!segStale(s.code)}).length}
function firstPendingSeg(){return segs().filter(function(s){return segStale(s.code)||!segChosen(s.code)})[0]||null}
function testOf(c){
  var hasP=!!(c.person&&c.person.trim()), hasO=!!(c.object&&c.object.trim()), hasA=!!(c.action&&c.action.trim()), hasC=!!(c.change&&c.change.trim());
  return {items:[["人",hasP,c.person],["东西",hasO,c.object],["动作",hasA,c.action],["变化",hasC,c.change]],pass:[hasP,hasO,hasA,hasC].filter(Boolean).length,banned:BANNED.test(c.text||"")};
}
function fmtTime(t){var d=new Date(t);function p(n){return (n<10?"0":"")+n}return p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
function arr(x){return Array.isArray(x)?x:[]}

// ---------- 节点状态（每次从档案算出来，不另存） ----------
function nodeStatus(id){
  if(!S) return {k:"todo",sub:"未开始"};
  if(running&&running.node===id) return {k:"run",sub:"运行中"};
  var sg=segs(), n=sg.length;
  switch(id){
    case "n01": return n?{k:"done",sub:"已分 "+n+" 段"}:(S.script&&S.script.raw?{k:"todo",sub:"待运行"}:{k:"wait",sub:"等你粘贴剧本"});
    case "n02": return S.split?{k:"done",sub:"已分开"}:{k:"todo",sub:n?"待运行":"未开始"};
    case "n03": return (S.ep&&S.ep.candidates&&S.ep.candidates.length)?{k:"done",sub:S.ep.candidates.length+" 个候选"}:{k:"todo",sub:"未开始"};
    case "n04": if(epChosen()) return {k:"done",sub:"已选 "+(epChosen().own?"你写的":S.ep.chosen)};
      return (S.ep&&S.ep.candidates&&S.ep.candidates.length)?{k:"wait",sub:"等你选"}:{k:"todo",sub:"未开始"};
    case "n05":
      if(!epChosen()) return {k:"todo",sub:"未开始"};
      var gen=sg.filter(function(s){var g=S.seg&&S.seg[s.code];return g&&g.candidates&&g.candidates.length}).length;
      var stale=sg.filter(function(s){return segStale(s.code)}).length;
      if(stale) return {k:"stale",sub:"待重算 "+stale+" 段"};
      if(gen===n&&n) return {k:"done",sub:n+" 段都有候选"};
      return gen?{k:"todo",sub:"已出 "+gen+"/"+n+" 段"}:{k:"todo",sub:"待运行"};
    case "n06":
      if(!epChosen()) return {k:"todo",sub:"未开始"};
      var ch=chosenCount();
      if(ch===n&&n) return {k:"done",sub:"已选 "+n+"/"+n+" 段"};
      var next=sg.filter(function(s){var g=S.seg&&S.seg[s.code];return g&&g.candidates&&g.candidates.length&&!segChosen(s.code)&&!segStale(s.code)})[0];
      return next?{k:"wait",sub:"已选 "+ch+"/"+n+"，等你选 "+next.code}:{k:"todo",sub:"已选 "+ch+"/"+n+" 段"};
    case "n07":
      if(!allSegChosen()) return {k:"todo",sub:"未开始"};
      if(S.test&&S.test.basedOn===segsHash()) return {k:"done",sub:S.test.ok?"连读通过":"有 "+(S.test.issues||[]).length+" 处可改"};
      return S.test?{k:"stale",sub:"待重测"}:{k:"todo",sub:"待运行"};
    case "n08":
      if(!allSegChosen()) return {k:"todo",sub:"物、人、景、秒"};
      if(S.tables&&S.tables.basedOn===segsHash()) return {k:"done",sub:(S.tables.beats||[]).length+" 拍"};
      return S.tables?{k:"stale",sub:"待重写"}:{k:"todo",sub:"待运行"};
    case "n09":
      if(!tablesFresh()) return {k:"todo",sub:"未开始"};
      if(S.checks&&S.checks.basedOn===S.tables.at) return {k:"done",sub:S.checks.issues.length?S.checks.issues.length+" 处漏洞":"没有漏洞"};
      return {k:"todo",sub:"待运行"};
    case "n10":
      if(!tablesFresh()) return {k:"todo",sub:"未开始"};
      var ps=S.tables.proposals||[], dec=S.decisions||{};
      var left=ps.filter(function(p){return !dec[p.id]}).length;
      return left?{k:"wait",sub:"还有 "+left+" 条等你"}:{k:"done",sub:"已取舍 "+ps.length+" 条"};
    case "n11": return (tablesFresh()&&nodeStatus("n10").k==="done")?{k:"done",sub:"可复制、可下载"}:{k:"todo",sub:"未开始"};
    case "n12": if(nodeStatus("n11").k!=="done") return {k:"todo",sub:"未开始"};
      return S.handedOff?{k:"done",sub:"已交接"}:{k:"wait",sub:"等你复制"};
  }
  return {k:"todo",sub:""};
}
function allSegChosen(){var sg=segs();return sg.length>0&&sg.every(function(s){return segChosen(s.code)&&!segStale(s.code)})}
function tablesFresh(){return !!(S&&S.tables&&S.tables.basedOn===segsHash())}
function nextNode(){for(var i=0;i<NODES.length;i++){var s=nodeStatus(NODES[i].id);if(s.k!=="done")return {n:NODES[i],s:s}}return null}
function defaultView(){var x=nextNode();return x?NODE_GO[x.n.id][0]:"prompt"}
function nextText(x){
  if(!x) return "全部走完了，剧情核心提示词已经交给导演 skill。";
  var n=segs().length;
  switch(x.n.id){
    case "n01": return "先让 Claude 读剧本、分段。";
    case "n02": return "下一步：把剧本里写定的和空着的分开。";
    case "n03": return "下一步：让 Claude 写 3 个集核心候选。";
    case "n04": return "现在等你选这一集的核心。";
    case "n05": return x.s.k==="stale"?"集核心改过了，有段落的候选要按新的集核心重算。":"下一步：让 Claude 给每一段写段核心候选。";
    case "n06": var p=firstPendingSeg(); return p?("现在等你选 "+p.code+" "+p.name+" 的段核心（已选 "+chosenCount()+"/"+n+"）。"):"现在等你选段核心。";
    case "n07": return x.s.k==="stale"?"段核心改过了，要重新连读测试。":"下一步：把 "+n+" 段的段核心连起来读，做能拍测试。";
    case "n08": return x.s.k==="stale"?"段核心改过了，四张表要重写。":"下一步：写四张表——物件、人物、场景、按秒节拍。";
    case "n09": return "下一步：自动检查秒数、物件去向和每一拍的核心。";
    case "n10": return "现在等你取舍 Claude 加的提案（"+x.s.sub+"）。";
    case "n11": return "剧情核心提示词可以合成了。";
    case "n12": return "剧情核心提示词合好了，复制给导演 skill 就行。";
  }
  return "";
}
function doneText(){
  if(!S) return "";
  var bits=[], ec=epChosen(), n=segs().length, c=chosenCount();
  if(ec) bits.push("集核心 "+(ec.own?"（你写的）":ec.id));
  if(c) bits.push(c===n?"全部 "+n+" 段段核心":c+" 段段核心");
  if(tablesFresh()) bits.push("四张表");
  return bits.length?(" 已经定了："+bits.join("、")+"。"):"";
}
function segTag(code){
  var g=S.seg&&S.seg[code], ch=segChosen(code);
  if(segStale(code)) return {cls:"stale",text:"待重算",tag:'<span class="tag warn">待重算</span>',mk:"↻"};
  if(ch) return {cls:"ok",text:"已选 "+(ch.own?"你写的":ch.id),tag:'<span class="tag ok">已选 '+esc(ch.own?"你写的":ch.id)+'</span>',mk:"✓"};
  if(g&&g.candidates&&g.candidates.length) return {cls:"wait",text:"等你选",tag:'<span class="tag wait">等你选</span>',mk:"●"};
  return {cls:"todo",text:"未生成",tag:'<span class="tag dash">未生成</span>',mk:""};
}

// ---------- 渲染 ----------
function render(){
  renderMast(); renderView(); renderBar(); renderRail(); renderFoot(); afterRender();
}
function afterRender(){
  var bar=$("bar"); if(bar) document.documentElement.style.setProperty("--barh",bar.offsetHeight+"px");
  if(ui.scrollTo){
    var id=ui.scrollTo; ui.scrollTo=null;
    requestAnimationFrame(function(){
      if(id==="view-top"){var top=$("view").getBoundingClientRect().top+window.scrollY-(bar?bar.offsetHeight:0)-10; if(window.scrollY>top) window.scrollTo(0,top); return}
      var el=$(id); if(el) el.scrollIntoView({block:"start"});
    });
  }
  spy();
}
function testsHTML(c){
  var t=testOf(c);
  return '<div class="tests" aria-label="能拍测试">'+t.items.map(function(x){return x[1]?'<span class="tag ok"><b>'+x[0]+'</b>'+esc(x[2])+'</span>':'<span class="tag warn dash"><b>'+x[0]+'</b>没写出来</span>'}).join("")+(t.banned?'<span class="tag warn">有拍不出来的词</span>':'')+'</div>';
}
function quickHTML(){
  return '<div class="quick">'+(projects.length?'<label class="sr" for="projSel">选择项目</label><select id="projSel" class="proj">'+projects.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===pid?" selected":"")+'>'+esc(p.title||p.id)+'</option>'}).join("")+'</select>':'')+(db&&S&&!ui.newProj?'<button type="button" class="btn sm" data-action="new-project">新建项目</button>':'')+'</div>';
}
function renderMast(){
  var m=$("mast"), eb='<div class="mtop"><div class="eyebrow">剧情核心 · 剧本和导演 skill 之间</div>'+(ui.connecting?'':quickHTML())+'</div>';
  if(ui.connecting){m.innerHTML=eb+'<h1>剧情核心工作台</h1><p class="lede"><span class="spin"></span> 正在读取项目…</p>';return}
  if(!db){m.innerHTML=eb+'<h1>剧情核心工作台</h1><p class="lede"><b>这个页面要在 Claude 里打开。</b>项目、你的标注和每一版都存在 Claude 里；在这里看不到存储，所以没法保存。请在 Claude 应用或网页里打开。</p>';return}
  if(!S||ui.newProj){m.innerHTML=eb+'<h1>剧情核心工作台</h1><p class="lede">把一集剧本粘进来。Claude 先读剧本、分段，再和你一起定这一集的核心和每一段的核心，写成按秒的四张表，最后合成一份剧情核心提示词，交给导演 skill。</p>';return}
  var sg=segs(), D=totalDur();
  var h='<div class="mtop"><div class="eyebrow">剧情核心 · 剧本和导演 skill 之间'+(D?' · '+D+' 秒':'')+(sg.length?' · '+sg.length+' 段':'')+'</div>'+quickHTML()+'</div><h1>'+esc(S.title||"未命名项目")+'</h1>';
  var ec=epChosen();
  h+='<section class="core" aria-label="这一集的核心">';
  if(ec){
    h+='<div class="lab"><span>这一集的核心</span><span class="tag ok">已选 '+esc(ec.own?"你写的":ec.id)+'</span>'+(ec.tilt?'<span class="tag">'+esc(ec.tilt)+'</span>':'')+'<span class="sp"></span><button type="button" class="lnk" data-action="view" data-view="ep" data-to="sec-ep">改集核心</button></div>';
    h+='<p class="coretext">'+esc(ec.text)+'</p>'+(ec.own?'':testsHTML(ec));
  } else {
    h+='<div class="lab"><span>这一集的核心</span><span class="tag wait">还没定</span></div><p class="coretext empty">还没选。到“集核心”里从候选挑一句，或者自己写一句。</p>';
  }
  h+='</section>';
  var x=nextNode();
  h+='<p class="lede"><b>'+esc(nextText(x))+'</b>'+esc(doneText())+'</p>';
  h+='<div class="arc" aria-label="四个阶段">'+STAGES.map(stageHTML).join("")+'</div>';
  h+='<div class="mrow">'+(x?'<button type="button" class="btn pri" data-action="run-next"'+dis()+'>'+esc(BTN[x.n.id])+'</button>':'')+'<span class="note">按顺序走：Claude 的步骤点一下就跑，轮到你的步骤会停下来等你。</span></div>';
  h+=vlogHTML();
  m.innerHTML=h;
}
function stageHTML(st,i){
  var ss=st.nodes.map(function(id){return nodeStatus(id)});
  var cls=ss.some(function(s){return s.k==="run"})?"run":ss.some(function(s){return s.k==="wait"||s.k==="stale"})?"cur":ss.every(function(s){return s.k==="done"})?"done":"todo";
  var d=ss[ss.length-1].sub; for(var j=0;j<ss.length;j++){ if(ss[j].k!=="done"){d=ss[j].sub;break} }
  if(cls==="done") d="已完成 · "+ss[ss.length-1].sub;
  // 棕色描边跟着“现在看的是哪一页”走；“等你 / 运行中”另用小标签标
  var on=ui.view===st.key, flag=cls==="run"?'<span class="tag ok">运行中</span>':cls==="cur"?'<span class="tag wait">等你</span>':'';

function peakPoints(pts){
  var sorted=pts.slice().sort(function(a,b){return b[1]-a[1]}), out=[];
  for(var i=0;i<sorted.length&&out.length<2;i++){ if(out.every(function(o){return Math.abs(o[0]-sorted[i][0])>=10})) out.push(sorted[i]); }
  return out.sort(function(a,b){return a[0]-b[0]});
}

      sg.slice(1).map(function(s){var x=(s.a/D*W).toFixed(1);return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="100" style="stroke:var(--line)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>'}).join("")+
      '<polygon points="'+area+'" style="fill:var(--jade-soft)"/><polyline points="'+line+'" fill="none" style="stroke:var(--jade)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>'+

function segCard(s){

function annoText(scope, extra){
  var list=annosOf(scope);

  var L=[];

  }

  if(node==="n08"){
    var fix=opts.fix?("\n\n上一版检查出的漏洞（这一版必须补上）：\n"+opts.fix):"";
    return METHOD+"\n\n"+ctx()+fix+"\n\n按集核心和各段核心写四张表、全片规矩和提案。\n物件：贯穿全片的 3–6 样东西，每件写在核心里是什么、按秒的出现和当时的样子、最后在哪（必须交代）。\n人物：每段一行。\n场景：每个地点写在核心里干什么、出现在哪几段、里面放什么、东西在哪。\n节拍：按秒排，首尾相接盖满 0 到 "+(S.duration||120)+" 秒，每拍 2–8 秒，写场景、人、物、怎么演（看得见的动作）、核心走到哪一步、张力 0–10。\n规矩：4–8 条全片都要守的规矩。\n提案：你在剧本上额外加的设计，每条都能删，写清在哪、为什么。\n输出 JSON：{\"rules\":[\"……\"],\"props\":[{\"name\":\"……\",\"meaning\":\"……\",\"events\":[{\"t\":46,\"what\":\"开始写\"}],\"end\":\"……\"}],\"people\":[{\"seg\":\"01A\",\"age\":\"……\",\"want\":\"……\",\"doing\":\"……\",\"notDoing\":\"……\",\"him\":\"……\"}],\"scenes\":[{\"name\":\"……\",\"role\":\"……\",\"segs\":\"01A、01D\",\"contents\":\"……\"}],\"beats\":[{\"a\":0,\"b\":5,\"scene\":\"……\",\"people\":\"……\",\"objects\":\"……\",\"acting\":\"……\",\"core\":\"……\",\"tension\":2}],\"proposals\":[{\"id\":\"p1\",\"text\":\"……\",\"where\":\"01B\",\"why\":\"……\"}]}";
  }
  return "";
}
var ERR={not_granted:"你没有允许这个页面调用 Claude，所以这一步没跑。重新打开页面可以再选一次。",rate_limited:"调用太频繁了，等一会儿再点。",cancelled:"已停止。",invalid_json:"Claude 这次的回答格式不对，再点一次试试；还不行就少要一点内容。",prompt_too_large:"剧本太长了，先删掉不需要的部分再试。",sampling_disabled:"这个账号现在不能从页面调用 Claude。",refused:"Claude 拒绝了这次请求，换个说法再试。",session_expired:"登录过期了，刷新页面再试。"};
function errMsg(e){return ERR[e&&e.code]||("没跑成："+((e&&e.message)||"未知错误")+"。再点一次试试。")}
async function ask(node, prompt, opts){
  if(!sample){toast("在这里不能调用 Claude，请在 Claude 里打开这个页面。");throw {code:"unavailable"}}
  var ctl=new AbortController();
  running={node:node,ctl:ctl}; liveText=""; renderMast(); renderView(); renderBar(); renderRail(); afterRender();
  try{
    return await sample.json(prompt,{signal:ctl.signal,modelTier:(opts&&opts.tier)||"default",cache:(opts&&opts.fresh)?false:true,onText:function(u){liveText=u.text;var l=$("liveN");if(l)l.textContent=runText()}});
  } finally { running=null; liveText=""; }
}
function cleanCands(list){return arr(list).filter(function(c){return c&&c.text}).slice(0,4).map(function(c,i){return {id:String.fromCharCode(65+i),tilt:c.tilt||"",text:String(c.text),person:c.person||"",object:c.object||"",action:c.action||"",change:c.change||"",step:c.step||"",effect:c.effect||""}})}

async function runNode(node, opts){
  opts=opts||{}; var ok=false;
  try{
    if(node==="n01"){
      var r=await ask("n01",buildPrompt("n01"),{tier:"default"});
      var sg=arr(r.segments).map(function(s,i){return {code:s.code||("01"+String.fromCharCode(65+i)),name:s.name||"",a:+s.a||0,b:+s.b||0,text:s.text||""}});
      if(!sg.length) throw {message:"没有读出段落"};
      S.script.segments=sg; if(r.title&&!S.title) S.title=r.title; S.duration=+r.duration||sg[sg.length-1].b;
      S.split=null;S.ep=null;S.seg={};S.test=null;S.tables=null;S.checks=null;S.decisions={};S.curve=[];
      ui.view="ep"; ui.scrollTo="sec-script"; await commit("读剧本 · "+sg.length+" 段");
    } else if(node==="n02"){
      var r2=await ask("n02",buildPrompt("n02"));
      S.split={fixed:arr(r2.fixed),open:arr(r2.open)}; ui.scrollTo="sec-split"; await commit("已定和空着");
    } else if(node==="n03"){
      var r3=await ask("n03",buildPrompt("n03",opts),{fresh:opts.fresh});
      var keepOwn=((S.ep&&S.ep.candidates)||[]).filter(function(c){return c.own});
      S.ep=S.ep||{annotations:[]}; S.ep.candidates=cleanCands(r3.candidates).concat(keepOwn); S.ep.chosen=null; S.ep.annotations=S.ep.annotations||[];
      ui.view="ep"; ui.scrollTo="sec-ep"; await commit("集核心候选");
    } else if(node==="n05"){
      var codes=segs().filter(function(s){var g=S.seg&&S.seg[s.code];return !(g&&g.candidates&&g.candidates.length)||segStale(s.code)}).map(function(s){return s.code});
      if(!codes.length){toast("每一段都已经有候选了");return false}
      var r5=await ask("n05",buildPrompt("n05",{codes:codes}),{tier:"default"});
      arr(r5.segments).forEach(function(x){ if(codes.indexOf(x.code)<0) return; var g=segState(x.code); g.candidates=cleanCands(x.candidates).concat((g.candidates||[]).filter(function(c){return c.own})); g.chosen=null; g.basedOn=epText(); });
      ui.view="seg"; ui.scrollTo="seg-"+codes[0]; await commit("段核心候选 · "+codes.length+" 段");
    } else if(node==="seg1"){
      var code=opts.code, r6=await ask("seg1",buildPrompt("seg1",opts),{fresh:opts.fresh});
      var g=segState(code); g.candidates=cleanCands(r6.candidates).concat((g.candidates||[]).filter(function(c){return c.own})); g.chosen=null; g.basedOn=epText();
      ui.open[code]=true; ui.scrollTo="seg-"+code; await commit(code+" 重新生成");
    } else if(node==="n07"){
      var r7=await ask("n07",buildPrompt("n07"),{fresh:opts.fresh});
      S.test={ok:!!r7.ok,summary:r7.summary||"",issues:arr(r7.issues),basedOn:segsHash()}; ui.view="tables"; ui.scrollTo="sec-test"; await commit("能拍测试");
    } else if(node==="n08"){
      var r8=await ask("n08",buildPrompt("n08",opts),{tier:"complex",fresh:opts.fresh});
      var beats=arr(r8.beats).map(function(b){return {a:+b.a,b:+b.b,scene:b.scene||"",people:b.people||"",objects:b.objects||"",acting:b.acting||"",core:b.core||"",tension:+b.tension}});
      var props=arr(r8.proposals).map(function(p,i){return {id:p.id||("p"+(i+1)),text:p.text||"",where:p.where||"",why:p.why||""}});
      S.tables={rules:arr(r8.rules),props:arr(r8.props),people:arr(r8.people),scenes:arr(r8.scenes),beats:beats,proposals:props,basedOn:segsHash(),at:Date.now()};
      S.checks=null; S.decisions={}; ui.view="tables"; ui.scrollTo="sec-props"; await commit("四张表 · "+beats.length+" 拍");
    } else if(node==="n09"){
      S.checks={issues:runChecks(),basedOn:S.tables.at}; ui.view="tables"; ui.scrollTo="sec-check"; await commit("自动检查 · "+S.checks.issues.length+" 处");
    }
    ok=true;
  }catch(e){ if(e&&e.code!=="unavailable") toast(errMsg(e)); }
  render();
  return ok;
}
function runChecks(){
  var T=S.tables, issues=[], D=S.duration||120, beats=(T.beats||[]).slice().sort(function(a,b){return a.a-b.a});
  if(!beats.length) issues.push({where:"节拍",text:"节拍表是空的",fix:"重写四张表"});
  if(beats.length&&beats[0].a!==0) issues.push({where:"节拍",text:"第一拍不是从 0 秒开始，而是 "+beats[0].a+" 秒",fix:"补上开头"});
  for(var i=1;i<beats.length;i++){ if(beats[i].a!==beats[i-1].b) issues.push({where:"节拍",text:"第 "+beats[i-1].b+" 秒和第 "+beats[i].a+" 秒之间"+(beats[i].a>beats[i-1].b?"空了一段":"重叠了"),fix:"让两拍首尾相接"}); }
  if(beats.length&&beats[beats.length-1].b!==D) issues.push({where:"节拍",text:"最后一拍停在 "+beats[beats.length-1].b+" 秒，全片是 "+D+" 秒",fix:"补到片尾"});
  beats.forEach(function(b){ if(!b.core||!String(b.core).trim()) issues.push({where:"节拍 "+b.a+"–"+b.b+" 秒",text:"“核心走到哪”是空的",fix:"这一拍要么说清推进了哪一步，要么删掉或并进别的拍"}); });
  (T.props||[]).forEach(function(p){ if(!p.end||/[？?]|未|不明/.test(p.end)) issues.push({where:"物件 · "+p.name,text:"最后去哪没有交代",fix:"写清它最后在谁手上、在哪"}); });
  segs().forEach(function(s){ if(!segChosen(s.code)) issues.push({where:s.code,text:"这一段还没选段核心",fix:"回到段核心页选一个"}); });
  beats.forEach(function(b){ if(BANNED.test(b.acting||"")) issues.push({where:"节拍 "+b.a+"–"+b.b+" 秒",text:"“怎么演”里有拍不出来的词",fix:"换成手上的动作或看得见的结果"}); });
  return issues;
}
function goNode(id){
  var g=NODE_GO[id]; ui.view=g[0];
  var anchor=g[1];
  if(!anchor&&(id==="n05"||id==="n06")){var p=firstPendingSeg(); anchor=p?"seg-"+p.code:"view-top"}
  ui.scrollTo=anchor||"view-top"; render();
}
function runNext(){
  var x=nextNode();
  if(!x){goNode("n12");return}
  var n=x.n, s=x.s;
  if(n.kind==="human"||s.k==="wait"||n.id==="n11"||n.id==="n12"){goNode(n.id);toast("轮到你："+n.label);return}
  if(n.id==="n05"&&!epChosen()){goNode("n04");return}
  goNode(n.id); runNode(n.id);
}

// ---------- 保存（db） ----------
async function saveProject(){
  if(!db||!pid) return;
  var data={title:S.title||"",updatedAt:Date.now(),json:JSON.stringify(S)};
  writing=writing.then(function(){return db.doc("projects/"+pid).set(data)}).catch(function(e){toast("保存失败："+((e&&e.message)||e))});
  return writing;
}
async function commit(label){
  S.updatedAt=Date.now();
  await saveProject();
  if(!db||!pid) return;
  var n=(checkpoints[0]&&checkpoints[0].n||0)+1;
  try{ await db.collection("projects/"+pid+"/checkpoints").add({n:n,label:label,at:Date.now(),json:JSON.stringify(S)}); }catch(e){}
}
function listenProject(id, keepState){
  if(unsubProject) unsubProject(); if(unsubChecks) unsubChecks();
  pid=id; if(!keepState){S=null; ui.view=null; ui.open={}} checkpoints=[];
  try{ localStorage.setItem("jqhx.pid",id) }catch(e){}
  unsubProject=db.doc("projects/"+id).onSnapshot(function(snap){
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    var d=snap.exists?snap.data():null; if(!d||!d.json) return;
    try{ var incoming=JSON.parse(d.json); if(!S||JSON.stringify(S)!==d.json){ S=incoming; render(); } }catch(e){}
  },function(){});
  unsubChecks=db.collection("projects/"+id+"/checkpoints").orderBy("n","desc").limit(12).onSnapshot(function(q){
    checkpoints=q.docs.map(function(d){var x=d.data();return {id:d.id,n:x.n,label:x.label,at:x.at,json:x.json}}); if(S&&!ui.newProj){renderMast()}
  },function(){});
}

// ---------- 交互 ----------
async function copyText(text, el){
  try{await navigator.clipboard.writeText(text);toast("已复制");return true}
  catch(e){ if(el){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);} toast(el?"没能直接复制，已帮你选中文字，按 Ctrl+C 复制":"没能复制"); return false }
}
document.addEventListener("mouseup",function(ev){
  var t=ev.target.closest&&ev.target.closest(".ctext[data-cand]"); var sel=window.getSelection&&String(window.getSelection()||"").trim();
  if(t&&sel) ui.lastSel={scope:t.getAttribute("data-scope"),cand:t.getAttribute("data-cand"),text:sel};
});
document.addEventListener("input",function(ev){ var f=ev.target.closest&&ev.target.closest(".composer"); if(f&&ev.target.tagName==="TEXTAREA") ui.drafts[f.getAttribute("data-scope")]=ev.target.value; });
document.addEventListener("change",function(ev){
  if(ev.target&&ev.target.id==="projSel"&&ev.target.value){ ui.newProj=false; listenProject(ev.target.value); render(); }
});
document.addEventListener("toggle",function(ev){ if(ev.target.classList&&ev.target.classList.contains("vlog")) ui.vlogOpen=ev.target.open; },true);
document.addEventListener("submit",async function(ev){
  var f=ev.target; ev.preventDefault();
  if(f.classList.contains("annoForm")){
    var note=f.querySelector("[name=note]").value.trim(); if(!note) return;
    var quote=f.querySelector("[name=quote]").value.trim(), sc=f.getAttribute("data-scope");
    var holder=sc==="ep"?S.ep:segState(sc.slice(4)); holder.annotations=holder.annotations||[];
    holder.annotations.push({cand:f.getAttribute("data-cand"),quote:quote,note:note,at:Date.now()});
    ui.anno=null; render(); await commit("标注 · "+(quote||"一条意见")); toast("标注存好了，下次重新生成会照着改"); return;
  }
  if(f.classList.contains("composer")){
    var sc2=f.getAttribute("data-scope"), extra=(ui.drafts[sc2]||"").trim();
    var ok=sc2==="ep"?await runNode("n03",{extra:extra,fresh:true}):await runNode("seg1",{code:sc2.slice(4),extra:extra,fresh:true});
    if(ok){ui.drafts[sc2]="";render()} return;
  }
  if(f.id==="npForm"){
    var title=$("npTitle").value.trim(), raw=$("npScript").value.trim(); if(!title||!raw) return;
    var id="p"+Date.now().toString(36);
    S={v:1,title:title,duration:0,script:{raw:raw,segments:[]},seg:{},curve:[],decisions:{}};
    pid=id; ui.newProj=false; ui.view="ep"; ui.open={};
    await saveProject(); listenProject(id,true); render();
    runNode("n01");
  }
});
document.addEventListener("click",async function(ev){
  var b=ev.target.closest&&ev.target.closest("[data-action]"); if(!b||b.disabled) return;
  var a=b.getAttribute("data-action");
  if(a==="jump"){ev.preventDefault();var el=$(b.getAttribute("data-to"));if(el)el.scrollIntoView({block:"start"});return}
  if(a==="view"){ui.view=b.getAttribute("data-view");ui.anno=null;ui.scrollTo=b.getAttribute("data-to")||"view-top";render();return}
  if(a==="goseg"){ui.view="seg";ui.open[b.getAttribute("data-code")]=true;ui.scrollTo="seg-"+b.getAttribute("data-code");render();return}
  if(a==="new-project"){ui.newProj=true;render();return}
  if(a==="cancel-new"){ui.newProj=false;render();return}
  if(a==="run-next"){runNext();return}
  if(a==="stop"){if(running)running.ctl.abort();return}
  if(a==="run"){
    var nd=b.getAttribute("data-node"), opts={fresh:true};
    if(nd==="n01"&&segs().length){S.script.segments=[]}
    if(nd==="n08"&&b.getAttribute("data-fix")&&S.checks) opts.fix=S.checks.issues.map(function(x){return "- "+x.where+"："+x.text+"（"+x.fix+"）"}).join("\n");
    runNode(nd,opts);return;
  }
  if(a==="regen"){var sc=b.getAttribute("data-scope"); if(sc==="ep") runNode("n03",{fresh:true}); else runNode("seg1",{code:sc.slice(4),fresh:true}); return}
  if(a==="reopen"){ui.open[b.getAttribute("data-code")]=true;render();return}
  if(a==="collapse"){ui.open[b.getAttribute("data-code")]=false;ui.anno=null;ui.scrollTo="seg-"+b.getAttribute("data-code");render();return}
  if(a==="choose"){
    var scope=b.getAttribute("data-scope"), cid=b.getAttribute("data-cand");
    if(scope==="ep"){var changed=S.ep.chosen&&S.ep.chosen!==cid; S.ep.chosen=cid; ui.anno=null; render(); await commit("集核心选 "+cid+(changed?"（改过）":"")); toast(changed?"集核心改了，各段的段核心标成了“待重算”":"集核心定了。下一步：给每一段写段核心候选"); return}
    var code=scope.slice(4), g=segState(code); g.chosen=cid; g.basedOn=g.basedOn||epText(); ui.open[code]=false; ui.anno=null;
    var nx=firstPendingSeg();
    ui.scrollTo=nx?"seg-"+nx.code:"seg-"+code; render(); await commit(code+" 段核心选 "+cid);
    toast(nx?(code+" 定了，接着看 "+nx.code):"段核心都选好了。下一步：到“四张表”连起来读");
    return;
  }
  if(a==="copy-core"){var sc6=b.getAttribute("data-scope"),c6=segChosen(sc6.slice(4)); if(c6) copyText(c6.text); return}
  if(a==="anno"){var sc2=b.getAttribute("data-scope"),cd=b.getAttribute("data-cand");var q=(ui.lastSel&&ui.lastSel.scope===sc2&&ui.lastSel.cand===cd)?ui.lastSel.text:"";ui.anno={scope:sc2,cand:cd,quote:q};render();var n=$("an");if(n)n.focus();return}
  if(a==="anno-cancel"){ui.anno=null;render();return}
  if(a==="del-anno"){var sc3=b.getAttribute("data-scope"),idx=+b.getAttribute("data-i");var lst=sc3==="ep"?S.ep.annotations:segState(sc3.slice(4)).annotations;lst.splice(idx,1);render();await commit("删除一条标注");return}
  if(a==="own"){
    var sc4=b.getAttribute("data-scope"), txt=(ui.drafts[sc4]||"").trim(); if(!txt){toast("先在输入框里写下你自己的核心");return}
    var holder=sc4==="ep"?S.ep:segState(sc4.slice(4));
    var k=(holder.candidates||[]).filter(function(c){return c.own}).length+1;
    holder.candidates=(holder.candidates||[]).concat([{id:"W"+k,own:true,text:txt,person:"",object:"",action:"",change:"",step:"",effect:""}]); if(sc4!=="ep") holder.basedOn=holder.basedOn||epText();
    ui.drafts[sc4]=""; render(); await commit("写了自己的核心"); toast("存好了，点“选这个”就用你写的"); return;
  }
  if(a==="del-own"){var sc5=b.getAttribute("data-scope"),cd5=b.getAttribute("data-cand");var h5=sc5==="ep"?S.ep:segState(sc5.slice(4));h5.candidates=h5.candidates.filter(function(c){return c.id!==cd5});if(h5.chosen===cd5)h5.chosen=null;render();await commit("删除自写核心");return}
  if(a==="decide"){S.decisions=S.decisions||{};S.decisions[b.getAttribute("data-id")]=b.getAttribute("data-v");render();await saveProject();if(nodeStatus("n10").k==="done"){await commit("取舍提案");toast("提案都取舍好了。下一步：剧情核心提示词")}return}
  if(a==="decide-all"){S.decisions=S.decisions||{};(S.tables.proposals||[]).forEach(function(p){if(!S.decisions[p.id])S.decisions[p.id]="keep"});render();await commit("取舍提案");toast("提案都取舍好了。下一步：剧情核心提示词");return}
  if(a==="copy"){
    var dir=b.getAttribute("data-what")==="director";
    await copyText(dir?directorPrompt():composePrompt(), $(dir?"dirOut":"promptOut"));
    if(dir&&!S.handedOff){S.handedOff=true;render();await commit("交给导演 skill");}
    return;
  }
  if(a==="download"){
    if(!downloads){toast("这里不能下载，用“复制”吧");return}
    try{var r2=await downloads.save({filename:"剧情核心提示词-"+(S.title||"项目").replace(/[\\\/:*?"<>|《》]/g,"")+".md",data:composePrompt()}); if(r2&&r2.status==="saved") toast("已保存");}catch(e){ if(!(e&&e.code==="declined")) toast("没能下载："+((e&&e.message)||"")); }
    return;
  }
  if(a==="restore-cp"){var c=checkpoints.filter(function(x){return x.id===b.getAttribute("data-cp")})[0];if(!c)return;S=JSON.parse(c.json);ui.open={};ui.view=defaultView();render();await commit("回到 v"+c.n);toast("已回到 v"+c.n+"，另存成了新的一版");return}
  if(a==="fork-cp"){var c2=checkpoints.filter(function(x){return x.id===b.getAttribute("data-cp")})[0];if(!c2)return;var st=JSON.parse(c2.json);st.title=(st.title||"")+" · 分叉 v"+c2.n;var nid="p"+Date.now().toString(36);S=st;pid=nid;ui.open={};ui.view=defaultView();await saveProject();listenProject(nid,true);render();await commit("从 v"+c2.n+" 分叉");toast("已分叉成新项目，原来的项目没动");return}
});

// ---------- 启动 ----------
render();
async function boot(){
  var c=window.claude;
  if(!c||!c.use){ui.connecting=false;render();return}
  try{ var r=await Promise.all([c.use("db"),c.use("sample"),c.use("downloads")]); db=r[0];sample=r[1];downloads=r[2]; }catch(e){}
  if(!db){ui.connecting=false;render();return}
  var timer=setTimeout(function(){ if(ui.connecting){ui.connecting=false;render()} },10000);
  db.collection("projects").onSnapshot(function(q){
    clearTimeout(timer);
    projects=q.docs.map(function(d){var x=d.data();return {id:d.id,title:x.title,updatedAt:x.updatedAt||0}}).sort(function(a,b){return b.updatedAt-a.updatedAt});
    var wasConnecting=ui.connecting; ui.connecting=false;
    if(!pid&&projects.length){ var last=null; try{last=localStorage.getItem("jqhx.pid")}catch(e){} var pick=projects.filter(function(p){return p.id===last})[0]||projects[0]; listenProject(pick.id); }
    if(wasConnecting||!S) render(); else renderMast();
  },function(){ clearTimeout(timer); ui.connecting=false; render(); });
}
boot();
})();
